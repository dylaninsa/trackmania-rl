[project]
name = "trackmania-rl"
version = "0.1.0"
description = "MTI881 - Groupe 4 : apprentissage par renforcement sur TrackMania 2020 via TMRL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium",
    "numpy",
    "torch",
    "tensorboard",
]

[project.optional-dependencies]
# Nécessaire uniquement sur les machines qui lancent le jeu (Windows / Linux)
trackmania = ["tmrl"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["envs", "baselines", "networks", "algos", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
